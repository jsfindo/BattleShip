    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 3rem;
      padding: 2rem;
      flex-wrap: wrap;
    }
 
    .grid-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
 
    .grid-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      width: fit-content;
    }
 
    .label-enemy { background: #FCEBEB; color: #A32D2D; }
    .label-home  { background: #E6F1FB; color: #185FA5; }
 
    .col-labels {
      display: grid;
      grid-template-columns: 24px repeat(10, 36px);
      gap: 2px;
    }
 
    .col-label {
      font-size: 11px;
      color: #888;
      text-align: center;
      line-height: 24px;
    }
 
    .grid-row-wrapper {
      display: flex;
      gap: 2px;
    }
 
    .row-labels {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
 
    .row-label {
      font-size: 11px;
      color: #888;
      width: 24px;
      height: 36px;
      line-height: 36px;
      text-align: center;
    }
 
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 36px);
      gap: 2px;
    }
 
    .grid div {
      width: 36px;
      height: 36px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.12s;
    }
 
    .grid.enemy div:hover { background: #FCEBEB; }
    .grid.home  div:hover { background: #E6F1FB; }
  </style>
</head>
